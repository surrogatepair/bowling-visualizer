name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      # GitHub Pages serves the gh-pages branch; publishing is a commit to it.
      - name: Publish to the gh-pages branch
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git init --quiet site
          cd site
          if git fetch --quiet --depth 1 "$REMOTE" gh-pages; then
            git checkout --quiet -b gh-pages FETCH_HEAD
          else
            git checkout --quiet --orphan gh-pages
          fi

          # Replace the published files with the new build; .nojekyll makes Pages serve them as they are.
          git rm --quiet -r --ignore-unmatch .
          cp -R ../dist/. .
          touch .nojekyll
          git add --all

          if git diff --cached --quiet; then
            echo "The published site is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push --quiet "$REMOTE" gh-pages
